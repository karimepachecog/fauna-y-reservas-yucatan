name: validar

on:
  push:
  pull_request:

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validar datos si están en el checkout
        run: |
          if ! find datos -name 'fauna_*' -print -quit | grep -q .; then
            echo "datos/ no viaja en el repositorio. La revisión corre en local, con los archivos junto a etl/validar_datos.py."
            exit 0
          fi
          python etl/validar_datos.py
